name: Deploy VitePress site to Pages

on:
  push:
    branches: [main] # Assurez-vous que c'est bien la branche que vous utilisez (main ou master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm install # Utilisez pnpm install ou yarn install si applicable
      - name: Build with VitePress
        run: npm run docs:build # Vérifiez que ce script existe dans votre package.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Modifiez ce chemin pour qu'il corresponde à votre dossier de sortie réel
          # Par exemple, si vous utilisez un dossier 'docs' : path: docs/.vitepress/dist
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
